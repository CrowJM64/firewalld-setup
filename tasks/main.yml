---
########## FirewallD Setup  ##########
- name: Remove UFW is removed on Debian systems
  ansible.builtin.package:
    name: ufw
    state: absent
  when: ansible_facts['os_family'] in ["Debian"]

- name: Update apt cache (Debian)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts['os_family'] in ["Debian"]

- name: Install Pre-Req python3-firewall (Debian+Suse)
  ansible.builtin.package:
    name:
      - python3-firewall
    state: latest
  when: ansible_facts['os_family'] in ["Debian", "Suse"]

- name: Install the latest FirewallD (RHEL+Debian+Suse)
  ansible.builtin.package:
    name: firewalld
    state: latest
  when:
    - ansible_facts['os_family'] in ["RedHat", "Debian", "Suse"]
    - ansible_facts['distribution'] != "Fedora"

- name: Ensure Firewalld is installed and updated.
  ansible.builtin.command: dnf -y install firewalld
  changed_when: false
  when: ansible_facts['distribution'] == "Fedora"

- name: Configure FirewallD Open Ports
  ansible.posix.firewalld:
    port: "{{ item }}"
    state: enabled
    permanent: true
    immediate: false
    offline: true
  loop: "{{ fw_ports }}"
  register: ports_set

- name: Configure FirewallD Open Services
  ansible.posix.firewalld:
    service: "{{ item }}"
    state: enabled
    permanent: true
    immediate: false
    offline: true
  loop: "{{ fw_services }}"
  register: services_set

- name: Ensure FirewallD is enabled
  ansible.builtin.service:
    name: firewalld
    enabled: yes

- name: Restart FirewallD With Changes
  ansible.builtin.service:
    name: firewalld
    state: restarted
  when:
    - ports_set is changed or services_set is changed