---
# Purpose: assert that the instance really ended up in the expected state.
# Molecule calls this playbook with `molecule verify`.
- name: Verify
  hosts: all
  gather_facts: true
  vars:
    expected_ports: "22/tcp"
    expected_services: "ssh"
  tasks:
    - name: Check Firewalld service is running
      ansible.builtin.systemd:
        name: firewalld
      register: firewalld_svc
      failed_when: firewalld_svc.status.ActiveState != "active"
