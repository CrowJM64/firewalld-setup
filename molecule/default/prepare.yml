---
# Purpose: install what a real server would already have (the base images ship without sshd).
# Molecule calls this playbook with `molecule prepare`.
- name: Prepare
  hosts: all
  gather_facts: true
  tasks:
    - name: Allow services to start/reload during package installs (Debian containers)
      ansible.builtin.file:
        path: /usr/sbin/policy-rc.d
        state: absent
      when: ansible_facts['os_family'] == "Debian"

    - name: Update apt cache (Debian)
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_facts['os_family'] == "Debian"

    - name: Install UFW (Debian)
      ansible.builtin.package:
        name:
          - ufw
        state: latest
      when: ansible_facts['os_family'] == "Debian"