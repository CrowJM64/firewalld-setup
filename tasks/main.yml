---
########## FirewallD Setup  ##########
- name: Disable UFW
  ansible.builtin.service:
    name: ufw
    enabled: false
  when: ansible_facts['os_family'] in ["Debian"]

- name: Stop UFW
  ansible.builtin.service:
    name: ufw
    state: stopped
  when: ansible_facts['os_family'] in ["Debian"]

- name: Update apt cache (Debian)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts['os_family'] in ["Debian"]

- name: Install Pre-Req python3-firewall (Debian)
  ansible.builtin.package:
    name:
      - python3-firewall
    state: latest
  when:
    - ansible_facts['os_family'] == "Debian"

- name: FirewallD installation
  block:
    - name: Install FirewallD
      ansible.builtin.package:
        name: firewalld
        state: present
      when:
        - ansible_facts['os_family'] in ["RedHat", "Debian"]

    - name: Start Firewalld
      ansible.builtin.service:
        name: firewalld
        state: started

    - name: Ensure FirewallD is enabled
      ansible.builtin.service:
        name: firewalld
        enabled: yes

    - name: Configure FirewallD Open Ports
      ansible.posix.firewalld:
        port: "{{ item }}"
        state: enabled
        permanent: true
        immediate: false
        offline: true
      loop: "{{ fw_ports }}"
      register: ports_set

    - name: Configure FirewallD Open Services
      ansible.posix.firewalld:
        service: "{{ item }}"
        state: enabled
        permanent: true
        immediate: false
        offline: true
      loop: "{{ fw_services }}"
      register: services_set

    - name: Configure FirewallD Rich Rules 
      ansible.posix.firewalld:
        rich_rule: "{{ item }}"
        state: enabled
        permanent: true
        immediate: false
      loop: "{{ rich_rules }}"
      register: rich_rules_set

    - name: Reload FirewallD With Changes
      ansible.builtin.service:
        name: firewalld
        state: reloaded
      when:
        - ports_set is changed or services_set is changed or rich_rules_set is changed

#    - name: Force a failure to trigger the rescue
#      ansible.builtin.fail:
#        msg: "Intentional failure to test rescue logic"
#      register: expected_failure
#      when: ansible_facts['os_family'] == "Debian"

    - name: Remove UFW
      ansible.builtin.package:
        name: ufw
        state: absent

  rescue:
    - name: Rollback Changes - Remove FirewallD
      ansible.builtin.package:
        name: firewalld
        state: absent
      when: ansible_facts['os_family'] == "Debian"

    - name: Rollback Changes - Reenable UFW
      ansible.builtin.service:
        name: ufw
        enabled: true
      when: ansible_facts['os_family'] == "Debian"

    - name: Rollback Changes - Start UFW
      ansible.builtin.service:
        name: ufw
        state: restarted
      when: ansible_facts['os_family'] == "Debian"