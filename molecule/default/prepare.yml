---
# Purpose: install what a real server would already have (the base images ship without sshd).
# Molecule calls this playbook with `molecule prepare`.
- name: Prepare
  hosts: all
  gather_facts: true
  tasks:
    - name: Allow services to start/reload during package installs (Debian containers)
      ansible.builtin.file:
        path: /usr/sbin/policy-rc.d
        state: absent
      when: ansible_facts['os_family'] is "Debian"
